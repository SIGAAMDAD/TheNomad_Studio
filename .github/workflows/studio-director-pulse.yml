name: Studio deterministic hourly worker pulse
on:
  schedule:
    - cron: "16 * * * *"
      timezone: "America/Chicago"
    - cron: "0 23 * * *"
      timezone: "America/Chicago"
  workflow_dispatch:
    inputs:
      report_kind:
        type: choice
        description: Report type to generate
        required: true
        default: hourly
        options: [hourly, daily]
permissions:
  contents: write
concurrency:
  group: studio-comms-writer
  cancel-in-progress: false
jobs:
  pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read live Studio runtime and communications refs
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin refs/heads/studio/runtime:refs/remotes/origin/studio/runtime
          git fetch origin refs/heads/studio/comms:refs/remotes/origin/studio/comms
          git worktree add --detach "$RUNNER_TEMP/studio-runtime" refs/remotes/origin/studio/runtime
          git worktree add --detach "$RUNNER_TEMP/studio-comms" refs/remotes/origin/studio/comms
      - name: Produce evidence-only Director report
        shell: bash
        env:
          EVENT_CRON: ${{ github.event.schedule }}
          MANUAL_KIND: ${{ inputs.report_kind }}
        run: |
          set -euo pipefail
          MODE=hourly
          if [ "$EVENT_CRON" = "0 23 * * *" ]; then MODE=daily; fi
          if [ "$GITHUB_EVENT_NAME" = 'workflow_dispatch' ]; then MODE="$MANUAL_KIND"; fi
          python scripts/studio_director_pulse.py \
            --runtime-root "$RUNNER_TEMP/studio-runtime" \
            --comms-root "$RUNNER_TEMP/studio-comms" \
            --kind "$MODE" > "$RUNNER_TEMP/director-report-result.json"
          cat "$RUNNER_TEMP/director-report-result.json"
      - name: Preserve immutable report without promoting worker state
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/studio-comms"
          git config user.name 'nomad-studio-director-audit[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'studio(comms): archive workforce pulse'
          for attempt in 1 2 3; do
            if git push origin HEAD:refs/heads/studio/comms; then exit 0; fi
            git fetch origin refs/heads/studio/comms:refs/remotes/origin/studio/comms
            if ! git rebase refs/remotes/origin/studio/comms; then
              git rebase --abort || true
              echo 'DIRECTOR_REPORT_REBASE_CONFLICT' >&2
              exit 1
            fi
          done
          echo 'DIRECTOR_REPORT_PUBLISH_FAILED' >&2
          exit 1
      - name: Retain deterministic decision receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-director-pulse-${{ github.run_id }}
          path: ${{ runner.temp }}/director-report-result.json
          retention-days: 30
          if-no-files-found: ignore
