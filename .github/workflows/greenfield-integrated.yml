name: Greenfield integrated fail-closed gate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-greenfield:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require all implementation modules (missing is red)
        run: python infra/greenfield/ci_gate.py .
      - name: Cold install integrated tree
        run: python -m pip install -e '.[dev]'
      - name: Every suite including fault, chaos and security tests
        run: python infra/greenfield/ci_run_all.py .
      - name: Credential and insecure listener scan
        run: python infra/greenfield/security_scan.py .
      - name: Check compiled modules
        run: python -m compileall -q src/nomad_studio
