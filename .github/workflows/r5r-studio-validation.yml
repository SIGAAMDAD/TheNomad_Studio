name: R5R Studio cross-component verification
on:
  pull_request:
    paths:
      - 'src/studio/**'
      - 'tests/**'
      - 'schema/**'
      - 'CONTRACTS/**'
      - 'ui/**'
      - 'host/**'
      - '.github/workflows/r5r-studio-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r5r-verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
      R5_SCHEMA_PATH: ${{ github.workspace }}/schema/initial_schema.sql
      R5_CONTRACT_DIR: ${{ github.workspace }}/CONTRACTS
      R5_FROZEN_CONTRACTS: ${{ github.workspace }}/CONTRACTS
      NOMAD_R5_PACKET: ${{ github.workspace }}/CONTRACTS
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - name: Reference and integrated python checks
        run: python -m pytest -q tests/unit tests/integration tests/acceptance --ignore=tests/unit/h/test_contract_static.py
  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript source-independent contracts
        run: node --test ../tests/unit/k/*.test.mjs
      - name: Build user interface
        run: |
          npm ci
          npm run build
  dotnet:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build host/Nomad.ToolHost/Nomad.ToolHost.csproj -c Release
      - run: dotnet run --project tests/unit/h/Nomad.ToolHost.Tests.csproj -c Release
