name: Studio V4 skill contract validation
on:
  pull_request:
    paths:
      - 'skills/rpg-studio-all-roles/**'
      - 'skills/studio-director/**'
      - 'studio/workforce/v4/**'
      - '.github/workflows/studio-v4-skill-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-skill-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate canonical contract and role resource mirrors
        run: python scripts/verify_canonical_mirrors.py
      - name: Validate V4 roster and event examples
        run: python skills/rpg-studio-all-roles/scripts/validate_v4.py
      - name: Validate V4 workflow invariants
        run: python -m unittest discover -s skills/rpg-studio-all-roles/tests -v
