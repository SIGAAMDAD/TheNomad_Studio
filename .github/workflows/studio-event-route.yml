name: Studio event-worker routing (non-spending)
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, labeled]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
jobs:
  route-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout proposed controller and hierarchy
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: candidate
      - name: Checkout live job registry read-only
        uses: actions/checkout@v4
        with:
          repository: SIGAAMDAD/TheNomad_Studio
          ref: studio/runtime
          persist-credentials: false
          path: live
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate the complete hierarchy
        run: python candidate/scripts/work_event_router.py validate
      - name: Evaluate event against live job and spending gates
        shell: bash
        run: |
          python candidate/scripts/work_event_router.py route \
            --event "$GITHUB_EVENT_PATH" \
            --policy candidate/studio/workforce/hierarchy.v2.json \
            --jobs live/studio/jobs.json \
            --config live/studio/config.json > routing-result.json
          cat routing-result.json
      - name: Keep a non-executing audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-event-routing-${{ github.run_id }}
          path: routing-result.json
          if-no-files-found: ignore
          retention-days: 7
