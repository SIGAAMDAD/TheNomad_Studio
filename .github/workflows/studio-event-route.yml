name: Studio hierarchy validation (manual; no worker dispatch)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout reviewed main, not event-supplied code
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify historical hierarchy only
        run: python scripts/work_event_router.py validate
