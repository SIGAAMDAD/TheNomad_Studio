name: Studio CI evidence contract tests
on:
  pull_request:
    paths:
      - 'scripts/studio_ci_evidence.py'
      - 'tests/test_studio_ci_evidence.py'
      - 'studio/communications/schemas/source-ci-evidence.v1.schema.json'
      - '.github/workflows/studio-ci-*.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -p 'test_studio_ci_evidence.py' -v
