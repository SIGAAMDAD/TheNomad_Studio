name: Studio hourly reconciliation
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate and preview dispatch
        run: |
          python scripts/studio.py validate
          python scripts/studio.py dispatch > dispatch-preview.json
          cat dispatch-preview.json
      - uses: actions/upload-artifact@v4
        with:
          name: studio-dispatch-preview
          path: dispatch-preview.json
          retention-days: 7
