name: Studio hourly reconciliation
on:
  schedule:
    - cron: "3 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: studio-runtime-state
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout controller from default branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Preserve reviewed controller
        run: |
          mkdir -p "$RUNNER_TEMP/nomad_scripts"
          cp scripts/studio.py scripts/production.py scripts/github_api.py scripts/source_targets.py scripts/architecture_enforcer.py "$RUNNER_TEMP/nomad_scripts/"
          # Controller imports resolve policy relative to the preserved scripts directory.
          mkdir -p "$RUNNER_TEMP/studio/workforce"
          cp studio/workforce/source_targets.v1.json studio/workforce/architecture_policy.v1.json "$RUNNER_TEMP/studio/workforce/"
      - name: Checkout dedicated runtime branch
        shell: bash
        run: |
          if git ls-remote --exit-code --heads origin studio/runtime >/dev/null 2>&1; then
            git fetch origin refs/heads/studio/runtime:refs/remotes/origin/studio/runtime
            git switch -c studio/runtime --track origin/studio/runtime
          else
            git switch -c studio/runtime
          fi
      - name: Validate, apply receipts, reconcile reviews and reserve eligible work
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONPATH: ${{ runner.temp }}/nomad_scripts
        run: |
          python "$RUNNER_TEMP/nomad_scripts/studio.py" --root "$GITHUB_WORKSPACE" validate
          python "$RUNNER_TEMP/nomad_scripts/studio.py" --root "$GITHUB_WORKSPACE" process --write > receipt-results.json
          python "$RUNNER_TEMP/nomad_scripts/production.py" adjudicate --root "$GITHUB_WORKSPACE" --write > review-results.json
          python "$RUNNER_TEMP/nomad_scripts/production.py" status --root "$GITHUB_WORKSPACE" --write > feature-results.json
          python "$RUNNER_TEMP/nomad_scripts/studio.py" --root "$GITHUB_WORKSPACE" dispatch --write > dispatch-results.json
          python "$RUNNER_TEMP/nomad_scripts/studio.py" --root "$GITHUB_WORKSPACE" validate
          cat receipt-results.json
          cat review-results.json
          cat dispatch-results.json
      - name: Commit only runtime state to runtime branch
        shell: bash
        run: |
          git config user.name 'nomad-studio-controller[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add studio/jobs.json studio/slots.json studio/features.json
          if ! git diff --cached --quiet; then
            git commit -m "studio(runtime): reconcile receipts and reservations"
            git push origin HEAD:refs/heads/studio/runtime
          fi
      - name: Upload exact hourly decision receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-reconcile-${{ github.run_id }}
          path: |
            receipt-results.json
            review-results.json
            feature-results.json
            dispatch-results.json
          if-no-files-found: ignore
          retention-days: 7
