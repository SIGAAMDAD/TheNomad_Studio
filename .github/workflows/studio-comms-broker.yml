name: Studio communications broker (non-spending)
on:
  issue_comment:
    types: [created]
  schedule:
    - cron: '17,47 * * * *'
    - cron: '30 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
  issues: read
concurrency:
  group: studio-comms-writer
  cancel-in-progress: false
jobs:
  broker:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Open runtime and communications data as separate worktrees
        run: |
          git fetch origin refs/heads/studio/runtime:refs/remotes/origin/studio/runtime
          git fetch origin refs/heads/studio/comms:refs/remotes/origin/studio/comms
          git worktree add --detach "$RUNNER_TEMP/studio-runtime" refs/remotes/origin/studio/runtime
          git worktree add --detach "$RUNNER_TEMP/studio-comms" refs/remotes/origin/studio/comms
      - name: Ingest event or reconcile job issues
        shell: bash
        env:
          STUDIO_TOKEN: ${{ github.token }}
          EVENT_CRON: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = 'issue_comment' ]; then
            python scripts/studio_comms.py event --runtime-jobs "$RUNNER_TEMP/studio-runtime/studio/jobs.json" --comms-root "$RUNNER_TEMP/studio-comms" --worker-registry "$RUNNER_TEMP/studio-runtime/studio/chat_workers.json" --github-event "$GITHUB_EVENT_PATH" > "$RUNNER_TEMP/comms-result.json"
          else
            python scripts/studio_comms.py reconcile --runtime-jobs "$RUNNER_TEMP/studio-runtime/studio/jobs.json" --comms-root "$RUNNER_TEMP/studio-comms" --worker-registry "$RUNNER_TEMP/studio-runtime/studio/chat_workers.json" --github-token "$STUDIO_TOKEN" > "$RUNNER_TEMP/comms-result.json"
          fi
          cat "$RUNNER_TEMP/comms-result.json"
          if [ "$GITHUB_EVENT_NAME" != 'issue_comment' ]; then
            python scripts/studio_comms.py snapshot --runtime-jobs "$RUNNER_TEMP/studio-runtime/studio/jobs.json" --comms-root "$RUNNER_TEMP/studio-comms" --worker-registry "$RUNNER_TEMP/studio-runtime/studio/chat_workers.json" > "$RUNNER_TEMP/comms-snapshot.json"
          fi
          if [ "$GITHUB_EVENT_NAME" = 'schedule' ] && [ "$EVENT_CRON" = '30 6 * * *' ]; then
            python scripts/studio_comms.py digest --runtime-jobs "$RUNNER_TEMP/studio-runtime/studio/jobs.json" --comms-root "$RUNNER_TEMP/studio-comms" --worker-registry "$RUNNER_TEMP/studio-runtime/studio/chat_workers.json" > "$RUNNER_TEMP/comms-digest.json"
          fi
      - name: Publish only append-only event records
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/studio-comms"
          git config user.name 'nomad-studio-comms[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add events daily snapshots
          if ! git diff --cached --quiet; then
            git commit -m 'studio(comms): archive normalized worker events'
            for attempt in 1 2 3; do
              if git push origin HEAD:refs/heads/studio/comms; then
                exit 0
              fi
              git fetch origin refs/heads/studio/comms:refs/remotes/origin/studio/comms
              if ! git rebase refs/remotes/origin/studio/comms; then
                git rebase --abort || true
                echo 'COMMS_REBASE_CONFLICT; reconciliation will retry safely' >&2
                exit 1
              fi
            done
            echo 'COMMS_PUSH_FAILED; reconciliation will retry safely' >&2
            exit 1
          fi
      - name: Upload non-secret broker receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-comms-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/comms-result.json
            ${{ runner.temp }}/comms-digest.json
            ${{ runner.temp }}/comms-snapshot.json
          retention-days: 14
          if-no-files-found: ignore
