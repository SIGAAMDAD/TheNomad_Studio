name: Studio source CI evidence relay (read-only proof)
on:
  repository_dispatch:
    types: [studio-source-ci-v1]
permissions:
  contents: write
concurrency:
  group: studio-comms-writer
  cancel-in-progress: false
jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Obtain private-source read-only API token
        id: source-audit
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.STUDIO_SOURCE_AUDIT_APP_ID }}
          private-key: ${{ secrets.STUDIO_SOURCE_AUDIT_PRIVATE_KEY }}
          owner: SIGAAMDAD
          repositories: |
            Terrain3D
            NomadFramework
            The_Nomad
            NomadMain
            TheNomad_GOAP
      - name: Load immutable comms and Studio runtime separately
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin refs/heads/studio/runtime:refs/remotes/origin/studio/runtime
          git fetch origin refs/heads/studio/comms:refs/remotes/origin/studio/comms
          git worktree add --detach "$RUNNER_TEMP/studio-runtime" refs/remotes/origin/studio/runtime
          git worktree add --detach "$RUNNER_TEMP/studio-comms" refs/remotes/origin/studio/comms
      - name: Validate actual source workflow and write immutable evidence
        shell: bash
        env:
          SOURCE_READ_TOKEN: ${{ steps.source-audit.outputs.token }}
        run: |
          set -euo pipefail
          python scripts/studio_ci_evidence.py \
            --event "$GITHUB_EVENT_PATH" \
            --jobs "$RUNNER_TEMP/studio-runtime/studio/jobs.json" \
            --config "$RUNNER_TEMP/studio-runtime/studio/config.json" \
            --comms-root "$RUNNER_TEMP/studio-comms" \
            --token "$SOURCE_READ_TOKEN" \
            > "$RUNNER_TEMP/source-ci-evidence-result.json"
          cat "$RUNNER_TEMP/source-ci-evidence-result.json"
      - name: Commit source CI metadata receipt (not job promotion)
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/studio-comms"
          git config user.name 'nomad-studio-ci[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence/source_ci
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'studio(comms): preserve source CI metadata receipt'
          for attempt in 1 2 3; do
            if git push origin HEAD:refs/heads/studio/comms; then exit 0; fi
            git fetch origin refs/heads/studio/comms:refs/remotes/origin/studio/comms
            if ! git rebase refs/remotes/origin/studio/comms; then
              git rebase --abort || true
              echo 'SOURCE_CI_REBASE_CONFLICT; reconcile without force push' >&2
              exit 1
            fi
          done
          echo 'SOURCE_CI_PUBLISH_FAILED' >&2
          exit 1
      - name: Retain non-secret relay receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-source-ci-${{ github.run_id }}
          path: ${{ runner.temp }}/source-ci-evidence-result.json
          retention-days: 14
          if-no-files-found: ignore
