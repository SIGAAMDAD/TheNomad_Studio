name: Studio legacy metrics diagnostic (manual only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Checkout runtime facts (no writes)
        shell: bash
        run: |
          cp scripts/metrics.py "$RUNNER_TEMP/metrics.py"
          git fetch origin refs/heads/studio/runtime:refs/remotes/origin/studio/runtime
          git switch --detach origin/studio/runtime
          python "$RUNNER_TEMP/metrics.py" --root "$GITHUB_WORKSPACE" --output daily-report.md
          cat daily-report.md
      - uses: actions/upload-artifact@v4
        with:
          name: studio-daily-report-${{ github.run_id }}
          path: |
            daily-report.md
            daily-report.json
          retention-days: 30
