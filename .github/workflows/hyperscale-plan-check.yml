name: Hyperscale coordination design-only validation
on:
  pull_request:
    paths:
      - 'studio/architecture/hyperscale/v1/**'
      - '.github/workflows/hyperscale-plan-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-design:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate dependency DAG, wave ordering and path ownership
        run: python studio/architecture/hyperscale/v1/tools/validate_workgroups.py studio/architecture/hyperscale/v1/workgroups.json
      - name: Verify each workgroup brief matches the machine-readable plan
        shell: bash
        run: |
          python - <<'PY'
          import json
          import pathlib
          import re
          root = pathlib.Path("studio/architecture/hyperscale/v1")
          data = json.loads((root / "workgroups.json").read_text())
          assert len(data["workgroups"]) == 10
          assert len(data["waves"]) == 4
          for group in data["workgroups"]:
              short = "_".join(group["scope"])
              title = re.sub(r"[^A-Za-z0-9]+", "_", group["title"]).strip("_").upper()
              name = f"WG_{group['id']}_{short}_{title}.md"
              brief = (root / name).read_text()
              assert f"Workgroup {group['id']}" in brief
              assert data["baseline"] in brief
              if group["id"] != "I":
                  assert all(path.startswith(("services/coordination/", "tests/coordination/"))
                             for path in group["allowed_paths"])
          for filename in (
              "00_ARCHITECTURE.md", "01_CONTRACTS_AND_SEMANTICS.md",
              "02_MIGRATION_AND_WORKGROUPS.md", "03_CAPACITY_OPERATIONS_TESTS.md",
              "04_DEPLOYMENT_AND_SECURITY.md", "05_V1_CLEANUP_RECONCILIATION.md",
              "00_MASTER_PARALLELIZATION_AND_MERGE_MAP.md", "CHAT_LAUNCH_PROMPTS.md"):
              assert (root / filename).is_file(), filename
          print("PASS: source-grounded design workgroups and documentation present")
          PY
