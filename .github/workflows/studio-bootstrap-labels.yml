name: Studio bootstrap approval labels (manual)
on:
  workflow_dispatch:
permissions:
  issues: write
  contents: read
jobs:
  labels:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Create missing Studio labels without overriding existing labels
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          while IFS='|' read -r name color description; do
            if gh api "repos/$REPO/labels/$name" >/dev/null 2>&1; then
              echo "PRESERVED $name"
            else
              gh api --method POST "repos/$REPO/labels" -f "name=$name" \
                -f "color=$color" -f "description=$description" >/dev/null
              echo "CREATED $name"
            fi
          done <<'LABELS'
          studio:approved|0e8a16|Owner has explicitly approved scoped production
          studio:accepted|5319e7|Owner accepts verified feature candidate
          studio:finalized|1d76db|Owner confirms verified finalization evidence
          studio:cancel|b60205|Owner requests cancellation or deferral
          LABELS
