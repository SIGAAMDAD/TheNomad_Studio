name: Studio control validation
on:
  push:
    paths:
      - "studio/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/studio-check.yml"
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  controller-tests:
    # Never run isolated unit tests against live production assignments.
    if: github.ref != 'refs/heads/studio/runtime'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run deterministic regression suite
        run: python -m unittest discover -s tests -v
      - name: Validate reviewed control-plane bootstrap
        run: |
          python scripts/studio.py validate
          python scripts/studio.py status
          python scripts/studio.py dispatch
          python scripts/architecture_enforcer.py validate-policy
          python scripts/production.py validate
          python scripts/board_sync.py --fixture tests/fixtures/board_issues.json
          python scripts/metrics.py > /dev/null

  runtime-state:
    # Live commits are checked for consistency with code from reviewed main.
    # Live job data is never used as a unit-test fixture or overwritten.
    if: github.ref == 'refs/heads/studio/runtime'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout production state
        uses: actions/checkout@v4
        with:
          ref: studio/runtime
          path: live-state
          persist-credentials: false
      - name: Checkout reviewed controller
        uses: actions/checkout@v4
        with:
          ref: main
          path: reviewed-controller
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate actual runtime assignments and dependencies
        run: |
          python reviewed-controller/scripts/studio.py --root live-state validate
          python reviewed-controller/scripts/production.py --root live-state validate
      - name: Display current assignments without modifying state
        run: python reviewed-controller/scripts/studio.py --root live-state status
