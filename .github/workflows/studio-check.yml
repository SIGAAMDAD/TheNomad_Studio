name: Studio control validation
on:
  push:
    paths:
      - "studio/**"
      - "scripts/**"
      - ".github/workflows/studio-check.yml"
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate studio
        run: |
          python scripts/studio.py validate
          python scripts/studio.py status
          python scripts/studio.py dispatch
