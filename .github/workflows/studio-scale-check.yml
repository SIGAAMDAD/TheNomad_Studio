name: Studio V1.5 coordination scale and safety tests
on:
  pull_request:
    paths:
      - 'scripts/studio_comms.py'
      - 'scripts/studio_inbox.py'
      - 'scripts/studio_worker_health.py'
      - 'scripts/studio_scale_probe.py'
      - 'tests/test_studio_scale_v15.py'
      - 'studio/communications/schemas/**'
      - '.github/workflows/studio-scale-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-scale:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run synthetic regression and negative tests
        run: python -m unittest discover -s tests -p 'test_studio_scale_v15.py' -v
      - name: Measure local-only 500-worker projector overhead
        run: python -m scripts.studio_scale_probe --workers 500 --events 10000 | tee studio-scale-probe.json
      - name: Retain measured synthetic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-v15-synthetic-scale-${{ github.run_id }}
          path: studio-scale-probe.json
          retention-days: 14
          if-no-files-found: ignore
