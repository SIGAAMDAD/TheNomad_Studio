name: Studio communications protocol tests
on:
  pull_request:
    paths:
      - 'scripts/studio_comms.py'
      - 'tests/test_studio_comms.py'
      - 'studio/communications/schemas/**'
      - '.github/workflows/studio-comms-*.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_studio_comms.py' -v
