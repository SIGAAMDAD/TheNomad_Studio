# Local/test-only disposable database; not a production deployment.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nomad_test
      POSTGRES_PASSWORD: local_test_only
      POSTGRES_DB: nomad_test
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nomad_test -d nomad_test"]
      interval: 2s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data
