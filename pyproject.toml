[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nomad-studio"
version = "0.1.0"
description = "Manually initiated ChatGPT / GitHub relay Studio control plane"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
coordinator = ["apsw>=3.46", "fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "jsonschema>=4.0,<5"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration", "tests/acceptance"]
addopts = "-ra"
pythonpath = ["src", "."]
