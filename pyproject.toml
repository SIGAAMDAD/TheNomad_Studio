[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nomad-studio"
version = "1.9.0"
description = "The Nomad Studio R9 feature-cabal production control plane"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
nomad-studio = "nomad_studio.app:main"

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

# R9 digest-pinned initial schema and exact table ownership are mandatory wheel resources.
[tool.setuptools.package-data]
"nomad_studio" = ["**/*.sql", "**/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests", ".", "tests/trust", "tests/creative_authority/impact", "tests/oversight_development"]
addopts = "--import-mode=importlib"
