name: Nomad engineering candidate evidence
# Copy into EACH actual source repository under .github/workflows/.
# The job is deterministic and produces a compact exact-SHA packet.
on:
  push:
    branches:
      - 'studio/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review-packet:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source with baseline history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch evidence builder from reviewed Studio main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Use a pinned vendor copy for private repositories if this runner
          # cannot read TheNomad_Studio; never execute unauthenticated arbitrary code.
          test -f scripts/engineering_packet.py || {
            echo "MISSING_EVIDENCE_BUILDER: vendor reviewed Studio script in this repo" >&2
            exit 1
          }
      - name: Detect baseline and produce check manifest
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ github.event.repository.default_branch }}"
          if [ -z "$BASE" ]; then BASE=main; fi
          # BASE must be supplied by the approved job; do not infer from GitHub default.
          if [ -z "${NOMAD_BASE_SHA:-}" ]; then
            echo "NOMAD_BASE_SHA is required (pinned job baseline)" >&2
            exit 1
          fi
          python - <<'PY'
          import json, os
          sha=os.environ['GITHUB_SHA']
          with open('nomad-checks.json','w') as f:
            json.dump({'checks':[{'name':'source build and static analysis','status':'NOT_RUN',
                                 'reason':'Run project-specific steps and replace this manifest',
                                 'head_sha':sha}]},f)
          PY
          python scripts/engineering_packet.py --repo . --base "$NOMAD_BASE_SHA" \
            --head "$GITHUB_SHA" --job "${NOMAD_JOB_ID:-UNASSIGNED}" \
            --checks nomad-checks.json --out nomad-review
        env:
          NOMAD_BASE_SHA: ${{ vars.NOMAD_BASE_SHA }}
          NOMAD_JOB_ID: ${{ vars.NOMAD_JOB_ID }}
      - name: Upload compact review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nomad-review-${{ github.sha }}
          path: |
            nomad-review/
            nomad-checks.json
          if-no-files-found: ignore
          retention-days: 21
